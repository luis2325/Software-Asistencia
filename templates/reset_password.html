{% extends "base.html" %}

{% block title %}Restablecer Contraseña{% endblock %}
{% block page_title %}Nueva Contraseña{% endblock %}
{% block welcome_text %}Ingresa tu nueva contraseña{% endblock %}

{% block content %}
<div class="reset-container">
    <form method="POST" action="{{ url_for('reset_password', token=token) }}" class="reset-form">
        <div class="form-group">
            <label>Nueva contraseña</label>
            <input type="password" name="password" class="filtro-input" required minlength="6">
        </div>
        <div class="form-group">
            <label>Confirmar contraseña</label>
            <input type="password" name="confirm_password" class="filtro-input" required>
        </div>
        <button type="submit" class="filtro-btn-exportar" style="width: 100%;">Restablecer contraseña</button>
    </form>
    <div class="reset-link">
        <a href="{{ url_for('login') }}">Recordé mi contraseña</a>
    </div>
</div>
{% endblock %}
