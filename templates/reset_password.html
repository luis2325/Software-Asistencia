<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0B0F19">
    <title>Nueva Contraseña | {{ product_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
</head>
<body class="auth-page">
    <main class="auth-card">
        <div class="auth-header">
            <div class="auth-icon-badge">
                <i class="fas fa-lock"></i>
            </div>
            <h1 class="auth-title">Nueva Contraseña</h1>
            <p class="auth-subtitle">
                Ingresa una contraseña segura de al menos 6 caracteres
            </p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="alerts-container">
                    {% for category, message in messages %}
                        <div class="auth-alert auth-alert-{{ category }}">
                            <i class="fas {% if category == 'success' %}fa-check-circle{% else %}fa-triangle-exclamation{% endif %}"></i>
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('reset_password', token=token) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="form-group">
                <label for="password" class="form-label">
                    <i class="fas fa-lock icon-cyan"></i> Nueva Contraseña
                </label>
                <input type="password" id="password" name="password" required minlength="6" class="form-input" placeholder="••••••••" autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">
                    <i class="fas fa-shield-halved icon-cyan"></i> Confirmar Contraseña
                </label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="6" class="form-input" placeholder="••••••••" autocomplete="new-password">
            </div>

            <button type="submit" class="btn-primary auth-submit-btn">
                <i class="fas fa-check"></i> Actualizar Contraseña
            </button>
        </form>

        <div class="auth-footer-links">
            <a href="{{ url_for('login') }}">
                <i class="fas fa-arrow-left"></i> Volver al Inicio de Sesión
            </a>
        </div>
    </main>
</body>
</html>
