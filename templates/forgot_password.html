<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0B0F19">
    <title>Recuperar Contraseña | {{ product_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
</head>
<body class="auth-page">
    <main class="auth-card">
        <div class="auth-header">
            <div class="auth-icon-badge">
                <i class="fas fa-key"></i>
            </div>
            <h1 class="auth-title">Recuperar Acceso</h1>
            <p class="auth-subtitle">
                Ingresa tu correo para recibir un enlace de restablecimiento seguro
            </p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="alerts-container">
                    {% for category, message in messages %}
                        <div class="auth-alert auth-alert-{{ category }}">
                            <i class="fas {% if category == 'success' %}fa-check-circle{% else %}fa-info-circle{% endif %}"></i>
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('forgot_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="form-group">
                <label for="email" class="form-label">
                    <i class="fas fa-envelope icon-cyan"></i> Correo Electrónico
                </label>
                <input type="email" id="email" name="email" required autofocus class="form-input" placeholder="tu-correo@empresa.com" autocomplete="email">
            </div>

            <button type="submit" class="btn-primary auth-submit-btn">
                <i class="fas fa-paper-plane"></i> Enviar Enlace Seguro
            </button>
        </form>

        <div class="auth-footer-links">
            <a href="{{ url_for('login') }}">
                <i class="fas fa-arrow-left"></i> Volver al Inicio de Sesión
            </a>
        </div>
    </main>
</body>
</html>
