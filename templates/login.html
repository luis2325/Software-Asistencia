<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Asistencia Inteligente</title>
    <!-- CSS exclusivo para el login -->
    <link rel="stylesheet" href="{{ url_for('static', filename='login_styles.css') }}">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="app-title">
                <h2>Asistencia Inteligente</h2>
                <p>reconocimiento facial inteligente</p>
            </div>

            <div class="divider"></div>

            <div class="face-scan-area">
                <div class="face-scanner">
                    <i class="fas fa-user-circle face-icon"></i>
                    <div class="landmark lm-eye-l"></div>
                    <div class="landmark lm-eye-r"></div>
                    <div class="landmark lm-nose"></div>
                    <div class="landmark lm-mouth-l"></div>
                    <div class="landmark lm-mouth-r"></div>
                    <div class="scan-line"></div>
                </div>
                <div class="scan-status">
                    <div class="main">SCAN FACE</div>
                    <div class="sub">PROCESSING</div>
                </div>
            </div>

            <div class="divider"></div>

            <!-- Mensajes flash -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- Formulario de login -->
            <form method="POST" action="{{ url_for('login') }}">
                <!-- CSRF TOKEN - SEGURIDAD REAL -->
                <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">

                <div class="form-group">
                    <label><i class="fas fa-user"></i> USUARIO</label>
                    <input type="text" name="username" required autofocus placeholder="admin">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> CONTRASEÑA</label>
                    <input type="password" name="password" required placeholder="••••••">
                </div>
                <button type="submit" class="login-btn">
                    <i class="fas fa-arrow-right-to-bracket"></i> INGRESAR
                </button>
            </form>

            <div class="forgot-link">
                <a href="{{ url_for('forgot_password') }}">¿Olvidaste tu contraseña?</a>
            </div>
        </div>
    </div>
</body>
</html>
