<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0B0F19">
    <title>Iniciar Sesión | {{ product_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
</head>
<body class="login-page">
    <main class="login-box">
        <div class="login-brand">
            <div class="login-logo-container">
                <svg class="login-logo-svg" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="loginGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#6366F1" />
                            <stop offset="50%" stop-color="#8B5CF6" />
                            <stop offset="100%" stop-color="#06B6D4" />
                        </linearGradient>
                        <filter id="loginLogoGlow" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#06B6D4" flood-opacity="0.6"/>
                        </filter>
                    </defs>
                    <rect x="2" y="2" width="44" height="44" rx="12" fill="#0E1424" stroke="url(#loginGradPrimary)" stroke-width="1.8" />
                    
                    <path d="M10 16V12C10 10.8954 10.8954 10 12 10H16" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>
                    <path d="M32 10H36C37.1046 10 38 10.8954 38 12V16" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>
                    <path d="M10 32V36C10 37.1046 10.8954 38 12 38H16" stroke="#6366F1" stroke-width="2" stroke-linecap="round"/>
                    <path d="M32 38H36C37.1046 38 38 37.1046 38 36V32" stroke="#6366F1" stroke-width="2" stroke-linecap="round"/>
                    
                    <path d="M17 21C17 27 20 32 24 33C28 32 31 27 31 21" stroke="url(#loginGradPrimary)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M18 19C20 16.5 28 16.5 30 19" stroke="#06B6D4" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8"/>
                    
                    <circle cx="20.5" cy="22.5" r="1.6" fill="#06B6D4" filter="url(#loginLogoGlow)" />
                    <circle cx="27.5" cy="22.5" r="1.6" fill="#06B6D4" filter="url(#loginLogoGlow)" />
                    <circle cx="24" cy="26" r="1.3" fill="#818CF8" />
                    <circle cx="24" cy="22.5" r="0.8" fill="#FFFFFF" />
                    
                    <line x1="20.5" y1="22.5" x2="27.5" y2="22.5" stroke="#06B6D4" stroke-width="1" stroke-dasharray="1.5,1.5" stroke-opacity="0.7"/>
                    <line x1="20.5" y1="22.5" x2="24" y2="26" stroke="#6366F1" stroke-width="1" stroke-opacity="0.5"/>
                    <line x1="27.5" y1="22.5" x2="24" y2="26" stroke="#6366F1" stroke-width="1" stroke-opacity="0.5"/>
                </svg>
                <div class="login-logo-glow"></div>
            </div>
            <h1 class="login-title">{{ product_name }}</h1>
            <p class="login-subtitle">{{ product_tagline }}</p>
        </div>

        <!-- Alertas Flash -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="alerts-container">
                    {% for category, message in messages %}
                        <div class="auth-alert auth-alert-{{ category }}">
                            <i class="fas {% if category == 'success' %}fa-check-circle{% else %}fa-triangle-exclamation{% endif %}"></i>
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="form-group">
                <label for="username" class="form-label">
                    <i class="fas fa-user icon-cyan"></i> Usuario
                </label>
                <input type="text" id="username" name="username" class="form-input" required autofocus placeholder="Nombre de usuario" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password" class="form-label">
                    <i class="fas fa-lock icon-cyan"></i> Contraseña
                </label>
                <input type="password" id="password" name="password" class="form-input" required placeholder="••••••••" autocomplete="current-password">
            </div>

            <button type="submit" class="btn-primary auth-submit-btn">
                <i class="fas fa-arrow-right-to-bracket"></i> Iniciar Sesión
            </button>
        </form>

        <div class="auth-footer-links">
            <a href="{{ url_for('forgot_password') }}">¿Olvidaste tu contraseña?</a>
        </div>
    </main>
</body>
</html>
